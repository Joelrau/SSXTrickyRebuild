[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=6E2C1B6A4F3D4E8C9A1B2C3D4E5F6071
ProjectName=SSX Tricky Rebuild

[/Script/UnrealEd.ProjectPackagingSettings]
; packaged game exe = SSXTricky.exe (Source/SSXTricky.Target.cs)
BuildTarget=SSXTricky
; release build: Shipping (no tests, debug switches or diagnostic logging; tests live in the editor-only
; SSXTrickyRebuildTests module). ForDistribution needs no signing on Win64.
BuildConfiguration=PPBC_Shipping
ForDistribution=True
IncludeDebugFiles=False
; cook the front end and all 11 tracks (opened by name, so nothing references them)
+MapsToCook=(FilePath="/Game/Maps/FrontEnd")
+MapsToCook=(FilePath="/Game/Maps/Gari")
+MapsToCook=(FilePath="/Game/Maps/Snow")
+MapsToCook=(FilePath="/Game/Maps/Elysium")
+MapsToCook=(FilePath="/Game/Maps/Mesa")
+MapsToCook=(FilePath="/Game/Maps/Merquer")
+MapsToCook=(FilePath="/Game/Maps/Megaple")
+MapsToCook=(FilePath="/Game/Maps/Aloha")
+MapsToCook=(FilePath="/Game/Maps/Alaska")
+MapsToCook=(FilePath="/Game/Maps/Pipe")
+MapsToCook=(FilePath="/Game/Maps/Untrack")
+MapsToCook=(FilePath="/Game/Maps/Trick")
; assets loaded by name at run time (characters via the asset registry, sound waves, materials, FE scene)
+DirectoriesToAlwaysCook=(Path="/Game/Characters")
+DirectoriesToAlwaysCook=(Path="/Game/Audio")
+DirectoriesToAlwaysCook=(Path="/Game/FrontEnd")
+DirectoriesToAlwaysCook=(Path="/Game/World")
+DirectoriesToAlwaysCook=(Path="/Game/Particles")
+DirectoriesToAlwaysCook=(Path="/Game/Rider")
; the Remastered look: its materials, derived texture maps and terrain shadow meshes (all loaded by name)
+DirectoriesToAlwaysCook=(Path="/Game/Remastered")
+DirectoriesToAlwaysCook=(Path="/Game/RemasterData")
+DirectoriesToAlwaysCook=(Path="/Game/TerrainShadow")

[Staging]
; rider "Mac" (Mac Fraser) data, not the Mac platform
+AllowedDirectories=SSXTrickyRebuild/Content/Characters/mac
+AllowedDirectories=SSXTrickyRebuild/GameData/converted/characters/mac
+AllowedDirectories=SSXTrickyRebuild/GameData/unpacked/TUTORIAL/MAC
